[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ebpf-telemetry"
version = "0.1.0"
description = "Reproducible comparison of sampled and switched eBPF collection"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1"]

[project.optional-dependencies]
analysis = ["numpy==2.3.4", "matplotlib==3.10.7"]

[project.scripts]
aet = "runner.cli:main"

[tool.setuptools.packages.find]
include = ["runner*", "analysis*"]
